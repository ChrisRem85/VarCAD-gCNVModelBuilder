[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gcnvrouter"
version = "0.1.0"
description = "Batch discovery and sample routing for GATK gCNV"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "plotly"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gcnvr = "gcnvrouter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
